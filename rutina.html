<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym Semanal · Lucho & Juli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000; --panel:#1c1c1e; --panel2:#2c2c2e; --line:#3a3a3c;
    --verde:#d0fc3e; --rojo:#fa114f; --cian:#1ad5fd;
    --texto:#fff; --muted:#98989f; --ok:#d0fc3e; --radius:18px;
    --accent:#d0fc3e;
  }
  body.perfil-juli{--accent:#fa114f; --ok:#fa114f}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--texto);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;
    padding-bottom:120px}
  .wrap{max-width:520px;margin:0 auto;padding:0 16px}

  header{padding:22px 0 10px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  h1{font-weight:800;font-size:clamp(28px,8vw,36px);letter-spacing:-.02em}
  h1 span{color:var(--accent)}

  .perfiles{display:flex;gap:8px;background:var(--panel);border-radius:99px;padding:4px}
  .pbtn{height:36px;padding:0 16px;border-radius:99px;border:none;background:transparent;color:var(--muted);font-weight:700;font-size:14px;cursor:pointer;transition:all .2s ease;font-family:inherit}
  .pbtn.activo{background:var(--accent);color:#000}

  .dias{display:flex;gap:8px;margin:16px 0 4px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  .dias::-webkit-scrollbar{display:none}
  .dbtn{flex:none;min-width:60px;height:58px;border-radius:16px;border:none;background:var(--panel);color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:all .2s ease;font-family:inherit}
  .dbtn .dl{font-weight:800;font-size:15px}
  .dbtn .dt{font-size:9px;letter-spacing:.02em;font-weight:600}
  .dbtn.activo{background:var(--accent);color:#000}
  .dbtn.hoy:not(.activo){box-shadow:inset 0 0 0 2px var(--cian)}

  .dia-titulo{font-weight:800;font-size:26px;letter-spacing:-.02em;margin:14px 0 2px}
  .dia-sub{font-size:13px;color:var(--muted);margin-bottom:14px;font-weight:500}

  /* ---- anillo estilo Apple ---- */
  .progress-card{background:var(--panel);border-radius:var(--radius);padding:16px;margin-bottom:14px;display:flex;align-items:center;gap:18px}
  .ring-box{position:relative;width:86px;height:86px;flex:none}
  .ring-box svg{transform:rotate(-90deg)}
  .ring-track{fill:none;stroke:var(--panel2);stroke-width:10}
  .ring-fill{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .5s ease}
  .ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
  .progress-info .progress-label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
  .progress-info .progress-msg{font-size:15px;font-weight:700;margin-top:3px;line-height:1.3}

  .card{background:var(--panel);border-radius:var(--radius);padding:16px;margin-bottom:12px;transition:opacity .3s}
  .card.done{opacity:.7}
  .card.done .ex-name{color:var(--ok)}
  .ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .ex-num{font-size:11px;color:var(--cian);font-weight:700;letter-spacing:.08em;margin-bottom:2px}
  .ex-name{font-weight:800;font-size:19px;letter-spacing:-.01em;line-height:1.1}
  .ex-scheme{font-size:13px;color:var(--accent);font-weight:800;white-space:nowrap;padding-top:3px;font-variant-numeric:tabular-nums}
  .ex-cue{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.45;font-weight:500}
  .ex-cue b{color:var(--texto)}

  .sets{margin-top:12px;display:flex;flex-direction:column;gap:8px}
  .shead{display:grid;grid-template-columns:56px 1fr 1fr 50px;gap:8px;font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:0 2px}
  .shead span:nth-child(2),.shead span:nth-child(3){text-align:center}
  .srow{display:grid;grid-template-columns:56px 1fr 1fr 50px;gap:8px;align-items:center}
  .stag{height:46px;border-radius:13px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
  .srow input{height:46px;width:100%;background:var(--panel2);border:none;border-radius:13px;color:var(--texto);font-family:inherit;font-size:16px;font-weight:700;text-align:center;outline:none;font-variant-numeric:tabular-nums}
  .srow input:focus{box-shadow:0 0 0 2px var(--cian)}
  .schk{height:46px;border-radius:50%;width:46px;justify-self:center;border:2.5px solid var(--panel2);background:transparent;color:transparent;font-size:19px;cursor:pointer;transition:all .2s ease}
  .schk:active{transform:scale(.9)}
  .srow.hecha .schk{background:var(--accent);border-color:var(--accent);color:#000}
  .srow.hecha .stag{opacity:.5}
  .srow.hecha input{opacity:.55}

  .check-row{display:flex;align-items:center;gap:13px;padding:13px 2px;border-bottom:.5px solid var(--line);cursor:pointer;user-select:none}
  .check-row:last-child{border-bottom:none}
  .check-box{width:28px;height:28px;flex:none;border:2.5px solid var(--panel2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent;transition:all .2s ease}
  .check-row.hecha .check-box{background:var(--ok);border-color:var(--ok);color:#000}
  .check-row.hecha .check-text{color:var(--muted);text-decoration:line-through}
  .check-text{font-size:15px;font-weight:600;line-height:1.3}
  .check-text small{display:block;color:var(--muted);font-size:12.5px;font-weight:500;margin-top:1px}

  .descanso-card{text-align:center;padding:36px 18px}
  .descanso-card .emoji{font-size:46px}
  .descanso-card h3{font-size:22px;font-weight:800;margin-top:10px}
  .descanso-card p{color:var(--muted);font-size:14px;margin-top:8px;line-height:1.5;font-weight:500}

  .timer{position:fixed;bottom:0;left:0;right:0;background:rgba(20,20,22,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom));z-index:50}
  .timer-inner{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:14px}
  .timer-num{font-weight:800;font-size:32px;min-width:100px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .timer-num.alerta{color:var(--rojo)}
  .timer-label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
  .timer-btns{margin-left:auto;display:flex;gap:8px}
  .tbtn{height:42px;padding:0 16px;border-radius:99px;border:none;background:var(--panel2);color:var(--texto);font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
  .tbtn.primary{background:var(--accent);color:#000}
  .timer-bar{height:4px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:8px}
  .timer-bar-fill{height:100%;width:0%;background:var(--cian);transition:width 1s linear}

  .fin{display:none;margin:16px 0 8px;background:linear-gradient(135deg,#173e17,#1f5c22);border:1px solid #2f7a33;border-radius:var(--radius);padding:18px;text-align:center}
  .fin.show{display:block}
  .fin h2{font-size:23px;font-weight:800}
  .fin p{font-size:13.5px;margin-top:5px;color:#c9f3cb;font-weight:500}

  .acciones{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
  .abtn{border:none;border-radius:99px;padding:13px 20px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .abtn.res{background:var(--accent);color:#000}
  .abtn.rst{background:var(--panel);color:var(--muted)}
  .saved-note{text-align:center;font-size:11.5px;color:var(--muted);margin-top:12px;font-weight:500}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <h1 id="titulo">Plan <span>Semanal</span></h1>
      <div class="perfiles">
        <button class="pbtn" data-perfil="lucho">Lucho</button>
        <button class="pbtn" data-perfil="juli">Juli</button>
      </div>
    </div>
    <div class="dias" id="dias"></div>
  </header>

  <div class="dia-titulo" id="diaTitulo"></div>
  <div class="dia-sub" id="diaSub"></div>

  <div class="progress-card" id="progCard">
    <div class="ring-box">
      <svg width="86" height="86" viewBox="0 0 86 86">
        <circle class="ring-track" cx="43" cy="43" r="36"/>
        <circle class="ring-fill" id="ringFill" cx="43" cy="43" r="36" stroke-dasharray="226.2" stroke-dashoffset="226.2"/>
      </svg>
      <div class="ring-num" id="progNum">0%</div>
    </div>
    <div class="progress-info">
      <div class="progress-label">Anillo del día</div>
      <div class="progress-msg" id="progMsg">¡A cerrar el anillo!</div>
    </div>
  </div>

  <div class="fin" id="finBanner"><h2>¡Día completado! 🔥</h2><p id="finMsg">Estira 5 min y a recuperar.</p></div>

  <div id="contenido"></div>

  <div class="acciones">
    <button class="abtn res" id="resumenBtn">📋 Copiar resumen para Claude</button>
    <button class="abtn rst" id="resetBtn">Reiniciar día</button>
  </div>
  <div class="saved-note">💾 Progreso y pesos se guardan solos por perfil y por día</div>
</div>

<div class="timer">
  <div class="timer-inner">
    <div><div class="timer-label">Descanso</div><div class="timer-num" id="timerNum">1:15</div></div>
    <div class="timer-btns">
      <button class="tbtn primary" id="timerStart">▶ 75s</button>
      <button class="tbtn" id="timerStop">Reset</button>
    </div>
  </div>
  <div class="timer-bar"><div class="timer-bar-fill" id="timerBar"></div></div>
</div>

<script>
(function(){
  var REST = 75, KEY = "gymSemanal_v1";

  function ex(id,nombre,esquema,series,reps,kg,cue,drop){return {tipo:"ex",id:id,nombre:nombre,esquema:esquema,series:series,reps:reps,kg:kg,cue:cue,drop:!!drop};}
  function ch(id,texto,sub){return {tipo:"check",id:id,texto:texto,sub:sub};}

  var DIAS = [
    {id:"dom",label:"Dom"},{id:"lun",label:"Lun"},{id:"mar",label:"Mar"},
    {id:"mie",label:"Mié"},{id:"jue",label:"Jue"},{id:"vie",label:"Vie"},{id:"sab",label:"Sáb"}
  ];

  var RUTINAS = {
    lucho: {
      dom: {titulo:"Cardio + Core", sub:"⏱ ~40 min · Watch: Bicicleta elíptica", items:[
        ch("c1","Elíptica","25-30 min, ritmo moderado"),
        ch("c2","Plancha","3 x 45 seg"),
        ch("c3","Elevación de piernas","3 x 15"),
        ch("c4","Plancha lateral","3 x 30 seg por lado")
      ]},
      lun: {titulo:"Pecho + Tríceps", sub:"⏱ ~60 min · Watch: Fuerza tradicional", items:[
        ex("e1","Press banca o máquina","4×10",4,10,null,"Bajada controlada, codos a ~45°."),
        ex("e2","Press inclinado mancuernas","4×10",4,10,null,"Pecho superior. Sin rebotar abajo."),
        ex("e3","Aperturas / Pec deck","3×12",3,12,null,"Apretón de <b>1 seg</b> al cerrar."),
        ex("e4","Extensión tríceps polea","4×12",4,12,null,"Codos pegados al cuerpo."),
        ex("e5","Tríceps francés","3×12",3,12,null,"Peso moderado, codos quietos.")
      ]},
      mar: {titulo:"Espalda + Bíceps", sub:"⏱ ~60 min · Watch: Fuerza tradicional", items:[
        ex("e1","Jalón al pecho","4×10",4,10,null,"Pecho afuera, jala con los codos."),
        ex("e2","Remo en máquina","4×10",4,10,null,"Aprieta escápulas <b>1 seg</b> atrás."),
        ex("e3","Remo con mancuerna","3×12",3,12,null,"Por lado. Espalda recta."),
        ex("e4","Curl con barra","4×10",4,10,null,"Sin balancear el cuerpo."),
        ex("e5","Curl martillo","3×12",3,12,null,"Trabaja braquial y antebrazo.")
      ]},
      mie: {titulo:"⚽ Fútbol Comfenalco", sub:"Watch: Fútbol", items:[
        ch("c1","Movilidad previa","5-10 min: cadera, rodilla, tobillo"),
        ch("c2","Partido","¡A romperla!"),
        ch("c3","Estiramiento post","5 min: cuádriceps, femoral, pantorrilla")
      ]},
      jue: {titulo:"Descanso", sub:"", descanso:{emoji:"🛌",titulo:"Jueves de recuperación",texto:"Hoy el músculo crece descansando. Hidrátate bien, duerme 7-8 horas y camina lo normal del día. Mañana: hombro + brazos."}},
      vie: {titulo:"Hombro + Brazos", sub:"⏱ ~60 min · Watch: Fuerza tradicional", items:[
        ex("e1","Press militar mancuernas","4×10",4,10,null,"Core apretado, sin arquear lumbar."),
        ex("e2","Elevaciones laterales","4×12",4,12,null,"Peso liviano, <b>técnica perfecta</b>."),
        ex("e3","Elevaciones frontales","3×12",3,12,null,"Alternadas, sin impulso."),
        ex("e4","Pájaros (posterior)","3×15",3,15,null,"Hombro sano = press fuerte."),
        ex("e5","Curl + tríceps superset","3×12",3,12,null,"Curl mancuernas + copa, sin descanso entre ambos.")
      ]},
      sab: {titulo:"Pierna · Rodilla Fuerte", sub:"⏱ ~70 min · Watch: Fuerza tradicional", items:[
        ch("c1","Elíptica","10 min calentamiento"),
        ex("e1","Prensa abierta","4×12",4,12,90,"Subimos a <b>90 kg</b> (hiciste 80×15 fácil). Bajada 3-4 seg."),
        ex("e2","Prensa cerrada","4×12",4,12,90,"Pies juntos, énfasis cuádriceps. También a <b>90 kg</b>."),
        ex("e3","Aductores en máquina","3×15",3,15,36,"Subimos a 36. Pausa 1 seg al cerrar."),
        ex("e4","Curl femoral","4×12",4,12,32,"Mantén 32 con bajada más lenta. Rodilla protegida."),
        ex("e5","Extensión de cuádriceps","4×15",4,15,32,"<b>Pausa 2-3 seg arriba.</b> No se negocia."),
        ex("e6","Elevación de talones","3×15",3,15,40,"Pausa 1-2 seg arriba."),
        ch("c2","Isométrica en pared","2 x 45 seg"),
        ch("c3","Equilibrio 1 pierna, ojos cerrados","30 seg por lado")
      ]}
    },
    juli: {
      dom: {titulo:"Cardio + Core", sub:"⏱ ~40 min · Watch: Bicicleta elíptica", items:[
        ch("c1","Elíptica o caminadora","25-30 min, ritmo moderado"),
        ch("c2","Plancha","3 x 30-45 seg"),
        ch("c3","Crunch en máquina o suelo","3 x 15"),
        ch("c4","Plancha lateral","3 x 20-30 seg por lado")
      ]},
      lun: {titulo:"Glúteo + Femoral", sub:"⏱ ~55 min · Watch: Fuerza tradicional", items:[
        ch("c1","Calentamiento","5 min cardio + puente de glúteo 2x15"),
        ex("e1","Hip thrust o puente con peso","4×12",4,12,null,"El rey del glúteo. <b>Pausa 1 seg arriba</b> apretando."),
        ex("e2","Peso muerto rumano mancuernas","4×10",4,10,null,"Bajada lenta, espalda recta. Femoral y glúteo."),
        ex("e3","Abductores en máquina","3×15",3,15,null,"Apretón de 1 seg al abrir."),
        ex("e4","Patada de glúteo en polea o máquina","3×12",3,12,null,"Por pierna. Sin arquear la espalda."),
        ex("e5","Curl femoral","3×12",3,12,null,"Controlado, sin tirones.")
      ]},
      mar: {titulo:"Tren Superior", sub:"⏱ ~50 min · Watch: Fuerza tradicional", items:[
        ex("e1","Jalón al pecho","4×12",4,12,null,"Espalda fuerte = mejor postura."),
        ex("e2","Remo en máquina","3×12",3,12,null,"Aprieta escápulas atrás."),
        ex("e3","Press de hombro mancuernas","3×12",3,12,null,"Peso cómodo, técnica limpia."),
        ex("e4","Elevaciones laterales","3×15",3,15,null,"Livianas, sin impulso."),
        ex("e5","Tríceps en polea","3×12",3,12,null,"Codos pegados al cuerpo.")
      ]},
      mie: {titulo:"Libre / Cardio opcional", sub:"", items:[
        ch("c1","Caminata o elíptica suave","20-30 min (opcional)"),
        ch("c2","Estiramiento general","10 min")
      ]},
      jue: {titulo:"Descanso", sub:"", descanso:{emoji:"🧘‍♀️",titulo:"Jueves de recuperación",texto:"Descanso total. Buena hidratación, buen sueño. Mañana: pierna con énfasis en cuádriceps."}},
      vie: {titulo:"Pierna · Cuádriceps", sub:"⏱ ~55 min · Watch: Fuerza tradicional", items:[
        ch("c1","Calentamiento","5 min cardio + sentadilla al aire 2x15"),
        ex("e1","Prensa de pierna","4×12",4,12,null,"Bajada controlada de 3 seg."),
        ex("e2","Sentadilla goblet","3×12",3,12,null,"Mancuerna al pecho, profundidad cómoda."),
        ex("e3","Zancadas estáticas","3×10 c/p",3,10,null,"Por pierna. Paso medio."),
        ex("e4","Extensión de cuádriceps","3×15",3,15,null,"Pausa 2 seg arriba."),
        ex("e5","Elevación de talones","3×15",3,15,null,"Pausa arriba, bajada profunda.")
      ]},
      sab: {titulo:"Full Body Ligero", sub:"⏱ ~50 min · Watch: Fuerza tradicional", items:[
        ex("e1","Hip thrust","3×15",3,15,null,"Peso moderado, apretón arriba."),
        ex("e2","Jalón al pecho","3×12",3,12,null,"Controlado."),
        ex("e3","Press de pecho en máquina","3×12",3,12,null,"Cómodo y limpio."),
        ex("e4","Abductores","3×15",3,15,null,"Cierre de la semana de glúteo."),
        ch("c1","Core","Plancha 3x30s + crunch 3x15"),
        ch("c2","Estiramiento","5-10 min completo")
      ]}
    }
  };

  /* ---------- Estado ---------- */
  var estado = {};
  try { estado = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){}
  function guardar(){ try { localStorage.setItem(KEY, JSON.stringify(estado)); } catch(e){} }

  /* ---- Migracion: rescatar la sesion marcada en la version anterior ---- */
  if (!estado._migradoV3){
    try {
      var viejo = JSON.parse(localStorage.getItem("rodillaFuerte_v3"));
      if (viejo){
        var mapaChecks = {c1:"c1", b1:"c2", b2:"c3"}; // eliptica, isometrica, equilibrio
        Object.keys(viejo).forEach(function(kv){
          var nk = null;
          if (mapaChecks[kv]) nk = "lucho::sab::" + mapaChecks[kv];
          else if (/^e[1-6]_s\d+$/.test(kv)) nk = "lucho::sab::" + kv;
          if (nk && !estado[nk]) estado[nk] = viejo[kv];
        });
      }
    } catch(e){}
    estado._migradoV3 = true;
    guardar();
  }

  var perfil = estado._perfil || "lucho";
  var HOY = ["dom","lun","mar","mie","jue","vie","sab"][new Date().getDay()];
  var dia = estado._dia || HOY;

  function k(itemId, extra){ return perfil + "::" + dia + "::" + itemId + (extra || ""); }

  /* ---------- Render tabs ---------- */
  var diasEl = document.getElementById("dias");
  DIAS.forEach(function(d){
    var b = document.createElement("button");
    b.className = "dbtn";
    b.innerHTML = '<span class="dl">' + d.label + '</span><span class="dt" id="dt_' + d.id + '"></span>';
    b.addEventListener("click", function(){ dia = d.id; estado._dia = dia; guardar(); render(); });
    b.id = "db_" + d.id;
    diasEl.appendChild(b);
  });

  document.querySelectorAll(".pbtn").forEach(function(b){
    b.addEventListener("click", function(){
      perfil = b.getAttribute("data-perfil");
      estado._perfil = perfil; guardar(); render();
    });
  });

  /* ---------- Render principal ---------- */
  var cont = document.getElementById("contenido");

  function render(){
    document.body.className = "perfil-" + perfil;
    document.getElementById("titulo").innerHTML = (perfil === "lucho" ? "Plan <span>Lucho</span>" : "Plan <span>Juli</span>");
    document.querySelectorAll(".pbtn").forEach(function(b){ b.classList.toggle("activo", b.getAttribute("data-perfil") === perfil); });

    DIAS.forEach(function(d){
      var r = RUTINAS[perfil][d.id];
      var el = document.getElementById("db_" + d.id);
      el.classList.toggle("activo", d.id === dia);
      el.classList.toggle("hoy", d.id === HOY);
      document.getElementById("dt_" + d.id).textContent = r.descanso ? "zzz" : (r.titulo.split(" ")[0].replace("⚽","Fút").slice(0,7));
    });

    var r = RUTINAS[perfil][dia];
    document.getElementById("diaTitulo").textContent = r.titulo;
    document.getElementById("diaSub").textContent = r.sub || "";

    cont.innerHTML = "";
    document.getElementById("finBanner").classList.remove("show");

    if (r.descanso){
      document.getElementById("progCard").style.display = "none";
      var c = document.createElement("div");
      c.className = "card descanso-card";
      c.innerHTML = '<div class="emoji">' + r.descanso.emoji + '</div><h3>' + r.descanso.titulo + '</h3><p>' + r.descanso.texto + '</p>';
      cont.appendChild(c);
      return;
    }
    document.getElementById("progCard").style.display = "";

    var numEj = 0;
    var cardChecks = null;
    r.items.forEach(function(item){
      if (item.tipo === "check"){
        if (!cardChecks){ cardChecks = document.createElement("div"); cardChecks.className = "card"; cont.appendChild(cardChecks); }
        var cid = k(item.id);
        var row = document.createElement("div");
        row.className = "check-row" + ((estado[cid] && estado[cid].done) ? " hecha" : "");
        row.innerHTML = '<div class="check-box">✓</div><div class="check-text">' + item.texto + '<small>' + (item.sub || "") + '</small></div>';
        row.addEventListener("click", function(){
          var st = estado[cid] || {}; st.done = !st.done; estado[cid] = st;
          row.classList.toggle("hecha", st.done); guardar(); actualizar();
        });
        cardChecks.appendChild(row);
      } else {
        cardChecks = null; numEj++;
        var card = document.createElement("div"); card.className = "card";
        var total = item.series + (item.drop ? 1 : 0);
        var html = '<div class="ex-head"><div><div class="ex-num">EJERCICIO ' + String(numEj).padStart(2,"0") + '</div>'
          + '<div class="ex-name">' + item.nombre + '</div></div>'
          + '<div class="ex-scheme">' + item.esquema + '</div></div>'
          + '<div class="ex-cue">' + item.cue + '</div>'
          + '<div class="sets"><div class="shead"><span>Serie</span><span>Kg</span><span>Reps</span><span></span></div>';
        for (var s = 0; s < total; s++){
          var esDrop = item.drop && s === total - 1;
          var sid = k(item.id, "_s" + s);
          var st = estado[sid] || {};
          html += '<div class="srow' + (st.done ? ' hecha' : '') + '" data-sid="' + sid + '">'
            + '<div class="stag">' + (esDrop ? 'DROP' : 'S' + (s+1)) + '</div>'
            + '<input type="number" inputmode="decimal" class="ikg" placeholder="kg" value="' + (st.kg != null ? st.kg : (item.kg != null ? item.kg : '')) + '">'
            + '<input type="number" inputmode="numeric" class="irep" value="' + (st.reps != null ? st.reps : item.reps) + '">'
            + '<button class="schk">✓</button></div>';
        }
        html += '</div>';
        card.innerHTML = html;
        cont.appendChild(card);
      }
    });

    cont.querySelectorAll(".srow").forEach(function(row){
      var sid = row.getAttribute("data-sid");
      var ikg = row.querySelector(".ikg"), irep = row.querySelector(".irep");
      row.querySelector(".schk").addEventListener("click", function(){
        var st = estado[sid] || {};
        st.done = !st.done;
        st.kg = ikg.value === '' ? null : parseFloat(ikg.value);
        st.reps = irep.value === '' ? null : parseInt(irep.value,10);
        if (st.done && st.kg == null){
          var prev = row.previousElementSibling;
          if (prev && prev.classList.contains("srow")){
            var pk = prev.querySelector(".ikg").value;
            if (pk !== ''){ ikg.value = pk; st.kg = parseFloat(pk); }
          }
        }
        estado[sid] = st;
        row.classList.toggle("hecha", st.done);
        guardar(); actualizar();
        if (st.done) startTimer();
      });
      [ikg, irep].forEach(function(inp){
        inp.addEventListener("change", function(){
          var st = estado[sid] || {};
          st.kg = ikg.value === '' ? null : parseFloat(ikg.value);
          st.reps = irep.value === '' ? null : parseInt(irep.value,10);
          estado[sid] = st; guardar();
        });
      });
    });

    actualizar();
  }

  /* ---------- Progreso ---------- */
  function actualizar(){
    var items = cont.querySelectorAll(".srow, .check-row");
    var done = 0;
    items.forEach(function(el){ if (el.classList.contains("hecha")) done++; });
    var pct = items.length ? Math.round(done / items.length * 100) : 0;
    var C = 226.2;
    document.getElementById("ringFill").style.strokeDashoffset = String(C * (1 - pct/100));
    document.getElementById("progNum").textContent = pct + "%";
    var msg = pct === 0 ? "¡A cerrar el anillo!" : pct < 50 ? "Vas calentando…" : pct < 100 ? "¡Ya casi lo cierras!" : "¡Anillo cerrado! 🔥";
    document.getElementById("progMsg").textContent = msg;
    document.getElementById("finBanner").classList.toggle("show", pct === 100 && items.length > 0);
    cont.querySelectorAll(".card").forEach(function(card){
      var its = card.querySelectorAll(".srow, .check-row");
      if (!its.length) return;
      var all = true;
      its.forEach(function(i2){ if (!i2.classList.contains("hecha")) all = false; });
      card.classList.toggle("done", all);
    });
  }

  /* ---------- Timer ---------- */
  var timerNum = document.getElementById("timerNum"), timerBar = document.getElementById("timerBar");
  var interval = null, remaining = REST;
  function fmt(s){ var m = Math.floor(s/60), r2 = s%60; return m + ":" + (r2<10?"0":"") + r2; }
  function renderT(){ timerNum.textContent = fmt(remaining); timerNum.classList.toggle("alerta", remaining <= 10 && remaining > 0); timerBar.style.width = ((REST-remaining)/REST*100) + "%"; }
  function tick(){
    remaining--;
    if (remaining <= 0){ remaining = 0; clearInterval(interval); interval = null;
      timerNum.textContent = "¡DALE!"; timerNum.classList.add("alerta"); timerBar.style.width = "100%";
      if (navigator.vibrate) navigator.vibrate([200,100,200]); return; }
    renderT();
  }
  function startTimer(){ clearInterval(interval); remaining = REST; renderT(); interval = setInterval(tick, 1000); }
  document.getElementById("timerStart").addEventListener("click", startTimer);
  document.getElementById("timerStop").addEventListener("click", function(){ clearInterval(interval); interval = null; remaining = REST; timerNum.classList.remove("alerta"); renderT(); timerBar.style.width = "0%"; });
  renderT();

  /* ---------- Resumen ---------- */
  document.getElementById("resumenBtn").addEventListener("click", function(){
    var r = RUTINAS[perfil][dia];
    var nombre = perfil === "lucho" ? "Lucho" : "Juli";
    var fecha = new Date().toLocaleDateString("es-CO", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
    var lineas = ["RESUMEN SESION - " + nombre.toUpperCase(), "Dia: " + r.titulo, "Fecha: " + fecha, ""];
    if (r.descanso){ lineas.push("Dia de descanso."); }
    else {
      r.items.forEach(function(item){
        if (item.tipo === "check"){
          var st = estado[k(item.id)] || {};
          lineas.push("- " + item.texto + ": " + (st.done ? "hecho" : "no"));
        } else {
          var total = item.series + (item.drop ? 1 : 0), hechas = 0, det = [];
          for (var s = 0; s < total; s++){
            var st2 = estado[k(item.id, "_s" + s)] || {};
            if (st2.done){ hechas++;
              det.push((st2.kg != null ? st2.kg : (item.kg != null ? item.kg : "?")) + "kg x" + (st2.reps != null ? st2.reps : item.reps)); }
          }
          lineas.push("- " + item.nombre + ": " + (hechas ? hechas + "/" + total + " series (" + det.join(", ") + ")" : "no realizada"));
        }
      });
      lineas.push("");
      lineas.push("Progreso: " + document.getElementById("progNum").textContent);
    }
    var texto = lineas.join("\n");
    function ok(){ var b = document.getElementById("resumenBtn"); var t = b.textContent; b.textContent = "✅ ¡Copiado!"; setTimeout(function(){ b.textContent = t; }, 2500); }
    if (navigator.share){ navigator.share({text: texto}).catch(function(){ if (navigator.clipboard) navigator.clipboard.writeText(texto).then(ok); }); }
    else if (navigator.clipboard){ navigator.clipboard.writeText(texto).then(ok); }
    else { prompt("Copia este resumen:", texto); }
  });

  /* ---------- Reset del día ---------- */
  document.getElementById("resetBtn").addEventListener("click", function(){
    if (!confirm("¿Reiniciar el día de " + (perfil === "lucho" ? "Lucho" : "Juli") + "? Se desmarcan las series, tus kg y reps quedan guardados.")) return;
    var pref = perfil + "::" + dia + "::";
    Object.keys(estado).forEach(function(key){
      if (key.indexOf(pref) === 0 && estado[key] && typeof estado[key] === "object"){
        estado[key].done = false; // conserva kg y reps para la proxima sesion
      }
    });
    guardar(); render();
  });

  render();
})();
</script>
</body>
</html>
