name: Mantener despierta la base de Discursos
on:
  schedule:
    - cron: "17 */12 * * *"   # cada 12 horas
  workflow_dispatch:
  push:
    paths: [".github/workflows/keepalive-discursos.yml"]
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a Supabase
        run: |
          KEY="sb_publishable_s77cAYroy7Q5XSZsvslQCQ_vHEAmk12"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://pswgldarwsdgznxyegov.supabase.co/rest/v1/rpc/app_ping" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}')
            echo "Intento $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1
